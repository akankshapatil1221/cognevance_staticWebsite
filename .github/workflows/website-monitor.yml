name: Website Uptime Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check website uptime and performance
        run: |
          URL="https://akankshapatil1221.github.io/cognevance_staticWebsite/"

          START=$(date +%s%3N)

          STATUS=$(curl -L -s -o /dev/null \
            -w "%{http_code}" \
            --max-time 30 \
            "$URL")

          END=$(date +%s%3N)

          RESPONSE_TIME=$((END - START))

          echo "Website: $URL"
          echo "HTTP Status: $STATUS"
          echo "Response Time: ${RESPONSE_TIME} ms"

          if [ "$STATUS" -ne 200 ]; then
            echo "Website is DOWN or returned an unexpected status."
            exit 1
          fi

          echo "Website is UP."